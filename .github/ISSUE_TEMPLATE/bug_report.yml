name: Bug report
description: Something did not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Two things help the most:
        the lines from the Activity panel (the log at the bottom of the
        window), and a clear picture of what happened versus what you
        expected.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. What did you do, what did the app do, and what did you expect instead?
      placeholder: |
        I added three packages and pressed Start queue. The first one
        transferred to 40% and then stayed there for minutes. I expected it
        to finish or show an error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can reproduce it, list the steps. If it happened once, say that too.
      placeholder: |
        1. Connect to the console
        2. Add two .pkg files
        3. Press Start queue
        4. Pause the active item
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Activity log lines
      description: Copy the relevant lines from the Activity panel (bottom of the window). They are small, readable and timestamped, and they help more than anything else.
      render: text
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the About window, or in the name of the archive you downloaded (for example v0.0.8).
      placeholder: v0.0.8
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Your platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Console side
      options:
        - GoldHEN Package Installer
        - RPI NextGen
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Network setup, console firmware, anything unusual about the files. Screenshots can be pasted directly.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I looked through the open issues and did not find this one already reported.
          required: true
