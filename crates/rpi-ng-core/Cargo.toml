[package]
name = "rpi-ng-core"
description = "Core library for Remote Package Installer NG: PS4 RPI protocol client, queue engine, package parsing, discovery, local file server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
if-addrs = "0.13"
percent-encoding = "2"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
